    <!-- Render immediately with the existing fallback, then apply Inter when ready. -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!--
      Current, Clarity and Google start only after the page load event.
      The pixel request is already issued above. Stubs stay here so a lead
      submitted before those libraries arrive is still queued.
    -->

      window.current=window.current||function(){(window.current.q=window.current.q||[]).push(arguments)};
      window.dataLayer=window.dataLayer||[];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7ZLQS38RJ7');
      gtag('config', 'G-VRKJP8K3SD');
      function loadDeferredTrackers(){
        if (loadDeferredTrackers.done) return;
        loadDeferredTrackers.done = true;
        var current = document.createElement('script');
        current.async = true;
        current.src = 'https://perfomance.verkoop.studio/t.js';
        current.setAttribute('data-site', 'cur_X__QIQRqLHhHyf9iIQc3h4S3M7zXnwag');
        document.head.appendChild(current);
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "yr9byb5ej9");
        var google = document.createElement('script');
        google.async = true;
        google.src = 'https://www.googletagmanager.com/gtag/js?id=G-VRKJP8K3SD';
        document.head.appendChild(google);
      }
      if (document.readyState === 'complete') loadDeferredTrackers();
      else window.addEventListener('load', loadDeferredTrackers, { once: true });
    </script>
