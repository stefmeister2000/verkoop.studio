      - article [ref=f75e63]:
        - generic [ref=f75e64]:
          - 'heading "Het korte antwoord: begin bij de vraag van je bezoeker" [level=2] [ref=f75e65]'
          - paragraph [ref=f75e66]: Gebruik een bestaande dienstenpagina als die de belofte van je campagne duidelijk waarmaakt. Kies een aparte landingspagina wanneer één doelgroep, aanbod of actie een eigen uitleg nodig heeft. Werk aan de volledige website als bezoekers meerdere diensten moeten vergelijken of als de algemene informatie en navigatie tekortschieten. Een nieuwe pagina is dus niet automatisch de beste eerste stap.
          - paragraph [ref=f75e67]: De keuze is ook niet altijd landingspagina óf website. Een campagnepagina kan gewoon onderdeel zijn van je bestaande site. Je hebt niet voor elke campagne een nieuw domein of een volledig nieuwe website nodig.
        - generic [ref=f75e68]:
          - heading "Wat is het verschil tussen een landingspagina, salespage en website?" [level=2] [ref=f75e69]
          - paragraph [ref=f75e70]: Google Ads noemt de pagina waarop iemand na een advertentieklik terechtkomt de landingspagina. Dat kan een homepage, productpagina of dienstenpagina zijn. In een websiteproject bedoelen we met een aparte landingspagina meestal een pagina die is uitgewerkt rond één concrete bezoekersvraag en vervolgstap.
          - paragraph [ref=f75e71]: "Een salespage is een verkoopgerichte pagina: ze helpt iemand beoordelen of een specifiek aanbod past en hoe die kan bestellen of contact opnemen. De lengte volgt uit de vragen die je moet beantwoorden, niet uit een vaste formule. Een volledige website biedt daarnaast samenhang tussen je diensten, bedrijf, contactinformatie en eventuele kennisartikelen."
        - generic [ref=f75e72]:
          - heading "Wanneer volstaat je bestaande dienstenpagina?" [level=2] [ref=f75e73]
          - paragraph [ref=f75e74]: Bekijk de pagina eerst alsof je de advertentie net hebt gezien. Vind je meteen de juiste dienst, het werkgebied, relevante informatie en een duidelijke volgende stap? Dan kan gericht verbeteren verstandiger zijn dan een tweede pagina bouwen met bijna dezelfde inhoud. Je houdt informatie en onderhoud op één plek.
          - paragraph [ref=f75e75]: "Denk aan dit fictieve voorbeeld: een installateur adverteert één dienst in zijn bestaande werkgebied. Zijn dienstenpagina legt de aanpak uit, beantwoordt praktische vragen en heeft een bruikbare aanvraagroute. Controleer die aansluiting voordat je een aparte campagnepagina laat maken. Ontbreekt informatie, vul dan eerst die leemte."
        - generic [ref=f75e76]:
          - heading "Wanneer heeft een aparte landingspagina meerwaarde?" [level=2] [ref=f75e77]
          - paragraph [ref=f75e78]: "Een eigen pagina wordt nuttig wanneer de campagne een andere beslissing ondersteunt dan de algemene dienstenpagina. Neem als fictief voorbeeld een evenementenlocatie: een organisator van een bedrijfsevent wil informatie over groepsgrootte, programma en praktische afspraken. Een individuele bezoeker zoekt mogelijk vooral openingsuren en beschikbaarheid. Die verschillende vragen kunnen afzonderlijke pagina’s rechtvaardigen."
          - paragraph [ref=f75e79]: Maak de inhoud specifiek voor die beslissing. Toon echte, passende voorbeelden en leg uit wat er na de aanvraag gebeurt. Google adviseert dat de bestemming aansluit op de advertentie en makkelijk bruikbaar is, ook op mobiel. Een opvallende knop compenseert geen ontbrekende uitleg of onduidelijk aanbod.
          - list [ref=f75e80]:
            - listitem [ref=f75e81]: De pagina gaat over hetzelfde aanbod als de advertentie.
            - listitem [ref=f75e82]: De bezoeker begrijpt voor wie het aanbod wel en niet geschikt is.
            - listitem [ref=f75e83]: Belangrijke voorwaarden en praktische informatie zijn vindbaar.
            - listitem [ref=f75e84]: Voorbeelden en bewijs zijn echt en controleerbaar.
            - listitem [ref=f75e85]: Contact opnemen werkt op een telefoon en de vervolgstap is duidelijk.
        - generic [ref=f75e86]:
          - heading "Wanneer moet je de bredere website aanpakken?" [level=2] [ref=f75e87]
          - paragraph [ref=f75e88]: Een losse campagnepagina lost niet alles op. Als je aanbod op verschillende pagina’s tegenstrijdig wordt beschreven, bezoekers diensten niet uit elkaar kunnen houden of bedrijfsinformatie ontbreekt, ligt de opdracht breder. Breng dan eerst structuur in de website en bepaal welke pagina welke vraag beantwoordt.
          - paragraph [ref=f75e89]: Bij meerdere diensten kan een heldere overzichtspagina helpen kiezen, met daaronder inhoudelijke dienstenpagina’s. Een campagne kan vervolgens rechtstreeks naar de meest passende pagina verwijzen. Zo hoeft de homepage niet tegelijk elke advertentie, doelgroep en aankoopvraag te beantwoorden.
        - generic [ref=f75e90]:
          - heading "Hoe beoordeel je of de gekozen pagina werkt?" [level=2] [ref=f75e91]
          - paragraph [ref=f75e92]: Leg vooraf vast wat telt als een geschikte aanvraag. Kijk vervolgens naar de route van campagnebezoek naar aanvraag en de verdere opvolging. Veel ingevulde formulieren zijn niet vanzelf goede aanvragen; een contact kan bijvoorbeeld buiten je werkgebied vallen. Bespreek daarom ook de kwaliteit met degene die de aanvragen behandelt.
          - paragraph [ref=f75e93]: Vergelijk resultaten over passende perioden en noteer veranderingen in advertentiebudget, doelgroep en aanbod. Bij weinig bezoeken of aanvragen is een groot percentageverschil nog geen betrouwbare conclusie. Een voor-en-na-vergelijking alleen bewijst bovendien niet dat de nieuwe pagina de oorzaak is. Houd verbeteringen overzichtelijk en test eerst of de meting en aanvraagroute werken.
        - generic [ref=f75e94]:
          - heading "Veelgestelde vragen over campagnepagina’s" [level=2] [ref=f75e95]
          - paragraph [ref=f75e96]: Heb ik eerst een volledige website nodig? Niet per se. Een gerichte pagina kan een eerste aanbod uitleggen, zolang bezoekers ook de nodige bedrijfsinformatie, voorwaarden en contactmogelijkheden vinden. Bepaal wel welke aanvullende informatie en functies jouw aanbod vereist.
          - paragraph [ref=f75e97]: Scoort een aparte salespage vanzelf beter in Google? Nee. Een pagina moet nuttig zijn en een eigen vraag beantwoorden. Kopieën die alleen een plaatsnaam of zoekwoord vervangen voegen weinig toe en kunnen onder Googles beleid tegen doorway-pagina’s vallen.
          - paragraph [ref=f75e98]: Moet alle navigatie verdwijnen? Nee. Houd de belangrijkste vervolgstap duidelijk, maar zorg dat bezoekers noodzakelijke informatie kunnen vinden. Begin bij de vragen die een beslissing tegenhouden, niet bij een universeel sjabloon. Onder ‘Van lezen naar toepassen’ vind je onze diensten en de primaire bronnen bij deze uitleg.
