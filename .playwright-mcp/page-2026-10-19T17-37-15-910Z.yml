          - generic [ref=f75e40]: Landingspagina’s & conversie
      - 'heading "Landingspagina of website: wat heb je nodig voor je campagne?" [level=1] [ref=f75e41]'
      - paragraph [ref=f75e42]: Een nieuwe landingspagina of je bestaande website gebruiken? Vergelijk de opties voor je campagne, met voorbeelden en een praktische beslischecklist.
